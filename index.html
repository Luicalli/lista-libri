<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lista Libri</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background-color: #f2f2f2;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tbody tr:nth-child(even) {
      background-color: #fafafa;
    }

    #search {
      margin-bottom: 15px;
      padding: 8px;
      width: 300px;
      font-size: 14px;
    }
    
    /* Migliora la tabella su schermi piccoli */
    @media (max-width: 6000px) {

      th, td {
        white-space: normal;   /* Permette il ritorno a capo */
      }

    /* Colonna Titolo */
    th:nth-child(1),
    td:nth-child(1) {
      width: 40%;            /* circa metà della larghezza attuale */
    }

    /* Colonna Autore */
    th:nth-child(2),
    td:nth-child(2) {
      width: 30%;            /* un po' più stretta */
    }
   }

.riga-presente {
  background-color: #d8f5d1 !important;
}


  </style>
</head>
<body>

<h1>Lista Libri</h1>

<input type="text" id="search" placeholder="Cerca titolo o autore...">

<table id="tabellaLibri">
  <thead>
    <tr>
      <th>Titolo</th>
      <th>Autore</th>
       <th>Anno</th>
       <th>Collezione</th>
      <th>Genere</th>
       <th>Letto1</th>
      <th>Presente</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  fetch('libri.json')
    .then(response => response.json())
    .then(data => {
      const tbody = document.querySelector('#tabellaLibri tbody');

      data.Libri.forEach(libro => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${libro.Titolo}</td>
          <td>${libro.Autore}</td>
          <td>${libro.Anno}</td>     
          <td>${libro.Collezione}</td>
          <td>${libro.Genere}</td>
          <td>${libro.Letto1}</td>          
          <td>${libro.Presente}</td>
        `;

        if (libro.Presente === "X") {
          riga.classList.add("riga-presente");
        }

        
        tbody.appendChild(tr);
      });
    });

  // Ricerca in tempo reale
  document.getElementById('search').addEventListener('input', function () {
    const filtro = this.value.toLowerCase();
    const righe = document.querySelectorAll('#tabellaLibri tbody tr');

    righe.forEach(riga => {
      const testo = riga.textContent.toLowerCase();
      riga.style.display = testo.includes(filtro) ? '' : 'none';
    });
  });
</script>

</body>
</html>
