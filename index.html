<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lista Libri</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background-color: #f2f2f2;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tbody tr:nth-child(even) {
      background-color: #fafafa;
    }

    #search {
      margin-bottom: 15px;
      padding: 8px;
      width: 300px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h1>Lista Libri</h1>

<input type="text" id="search" placeholder="Cerca titolo o autore...">

<table id="tabellaLibri">
  <thead>
    <tr>
      <th>Titolo</th>
      <th>Autore</th>
      <th>Genere</th>
      <th>Presente</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  fetch('libri.json')
    .then(response => response.json())
    .then(data => {
      const tbody = document.querySelector('#tabellaLibri tbody');

      data.Libri.forEach(libro => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${libro.Titolo}</td>
          <td>${libro.Autore}</td>
          <td>${libro.Genere}</td>
          <td>${libro.Presente}</td>
        `;
        tbody.appendChild(tr);
      });
    });

  // Ricerca in tempo reale
  document.getElementById('search').addEventListener('input', function () {
    const filtro = this.value.toLowerCase();
    const righe = document.querySelectorAll('#tabellaLibri tbody tr');

    righe.forEach(riga => {
      const testo = riga.textContent.toLowerCase();
      riga.style.display = testo.includes(filtro) ? '' : 'none';
    });
  });
</script>

</body>
</html>
